name: Example Workflow with Environment Variables

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MY_ENV_VAR: 'Hello, World!'
      ANOTHER_ENV_VAR: 'GitHub Actions'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Display environment variables
        run: |
          echo "MY_ENV_VAR is $MY_ENV_VAR"
          echo "ANOTHER_ENV_VAR is $ANOTHER_ENV_VAR"

      - name: Use environment variable in a script
        run: |
          echo "Using MY_ENV_VAR in a script: $MY_ENV_VAR"
