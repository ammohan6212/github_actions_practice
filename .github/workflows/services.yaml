# ### Example 7: **Using Neo4j as a Service**

# If you need a **graph database** for your tests, Neo4j is a great option.

# ```yaml
name: Test with Neo4j Service

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:latest
        ports:
          - 7474:7474   # Web UI
          - 7687:7687   # Bolt Protocol for client connections
        env:
          NEO4J_AUTH: neo4j/password

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest
