# ### Example 2: **Using RabbitMQ as a Service**

# If your application uses RabbitMQ for messaging, you can set up RabbitMQ as a service in GitHub Actions.

# ```yaml
name: Test with RabbitMQ Service

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672  # For accessing the management plugin UI
        env:
          RABBITMQ_DEFAULT_USER: user
          RABBITMQ_DEFAULT_PASS: password

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest
# ```

