# ### Example 6: **Using Nginx as a Service**

# You can use **Nginx** as a reverse proxy or for load balancing in testing environments.

# ```yaml
name: Test with Nginx Service

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      nginx:
        image: nginx:latest
        ports:
          - 8080:80

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest
# ```

