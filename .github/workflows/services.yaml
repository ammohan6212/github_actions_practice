# ### Example 5: **Using MinIO as a Service (S3-compatible Object Storage)**

# If your application interacts with object storage like Amazon S3, you can use **MinIO** for local testing.

# ```yaml
name: Test with MinIO Service

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ACCESS_KEY: minio
          MINIO_SECRET_KEY: minio123
        options: >-
          server /data

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
#           pytest
# ```

