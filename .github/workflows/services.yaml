# ### Example 4: **Using Elasticsearch as a Service**

# If your project depends on **Elasticsearch** for searching or indexing, you can set it up as a service.

# ```yaml
name: Test with Elasticsearch Service

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      elasticsearch:
        image: elasticsearch:7.9.2
        ports:
          - 9200:9200
        env:
          discovery.type: single-node

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest
# ```

