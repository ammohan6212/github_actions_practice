name: Complete Secrets Usage

on: [push]

# 🌍 1. Workflow-level secret via `env`
env:
  GLOBAL_SECRET: ${{ secrets.GLOBAL_SECRET }}

jobs:
  build:
    # 🧱 2. Job-level secret via `env`
    runs-on: ubuntu-latest
    env:
      JOB_SECRET: ${{ secrets.JOB_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🔐 3. Step-level secret via `env`
      - name: Step-level secret
        run: echo "Step-level secret is $STEP_SECRET"
        env:
          STEP_SECRET: ${{ secrets.STEP_SECRET }}

      # ⚠️ 4. Inline secret in run command (avoid in production)
      - name: Inline secret usage (avoid in real jobs)
        run: echo "Inline secret is ${{ secrets.INLINE_SECRET }}"

      # 🧩 5. Using secret as input to another action
      - name: Log in to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🐳 6. Passing secret to Docker container
      - name: Run Docker container with secret
        run: docker run -e API_KEY=${{ secrets.DOCKER_API_KEY }} alpine:latest env

      # 🌱 7. Use global and job env secrets
      - name: Echo all available secrets
        run: |
          echo "GLOBAL_SECRET = $GLOBAL_SECRET"
          echo "JOB_SECRET = $JOB_SECRET"

  deploy:
    # 🛡️ 8. Environment-specific secret (must be configured in repo settings)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Use environment secret
        run: echo "Environment secret is ${{ secrets.PROD_SECRET }}"


