name: Full Permissions Demo

on:
  push:
    branches:
      - dev
  pull_request:

# Set fine-grained permissions for GITHUB_TOKEN
permissions:
  actions: write             # Manage workflows (e.g., enable/disable)
  checks: write              # Update check runs and check suites
  contents: write            # Read and write repository content (e.g., push commits)
  deployments: write         # Create and manage deployments
  id-token: write            # Request OpenID Connect (OIDC) token
  issues: write              # Create and manage issues
  discussions: write         # Create and manage GitHub Discussions
  packages: write            # Publish packages (e.g., GitHub Packages)
  pages: write               # Deploy GitHub Pages
  pull-requests: write       # Create and update pull requests
  repository-projects: write# Update GitHub Projects
  security-events: write     # Upload SARIF files for security analysis
  statuses: write            # Set commit statuses

jobs:
  demo-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create a pull request comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🔐 This is a comment posted with all permissions enabled."
            })

      - name: Upload SARIF for Code Scanning (security-events)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: path/to/your-results.sarif

      - name: Trigger Deployment (deployments)
        run: echo "Simulating deployment"

      - name: Push commit to branch (contents)
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          echo "New content" >> file.txt
          git add file.txt
          git commit -m "Add new content"
          git push origin main
