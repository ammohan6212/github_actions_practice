# | `${{ github.sha }}`                 | The commit SHA that triggered the workflow.                     |
# | `${{ github.head_ref }}`            | The source branch for pull request events.                      |
# | `${{ github.base_ref }}`            | The base branch for pull request events.                        |
# | `${{ github.event.pull_request.title }}` | The title of the pull request.                            |
# | `${{ inputs.<input_name> }}`        | The value of a user-defined input from `workflow_dispatch`.     |
# | `${{ matrix.<key> }}`               | The current value of a matrix job parameter.                    |

